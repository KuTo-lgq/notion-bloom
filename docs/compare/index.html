<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课件和讲解对照 · Notion Bloom</title>
<style>
  :root { --ink: #1b2a4a; --muted: rgba(27, 42, 74, 0.62); --line: rgba(27, 42, 74, 0.12); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f6f2ea;
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif;
  }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.3px; }
  header p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
  .board {
    max-width: 1100px;
    margin: 12px auto 40px;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: start;
  }
  figure { margin: 0; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  figcaption { padding: 10px 14px 12px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }
  img { display: block; width: 100%; height: auto; }
  .slides { display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 800px) {
    .board { grid-template-columns: 1fr; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
  <header>
    <h1>课件页和讲解排版</h1>
    <p>左边三张是 <code>examples/bayes-lecture.pptx</code> 里的幻灯片。右边是按这三页文字和公式排的讲解。静态截图，不是 Notion 在线页面。</p>
    <p><code>examples/fixtures/short.pptx</code> 只有文字、没有可截的整页图，所以对照用这一份。</p>
  </header>
  <div class="board">
    <div class="slides">
      <figure>
        <img src="slide-01.png" alt="第 1 页 公式">
        <figcaption>课件 · 第 1 页 · 公式</figcaption>
      </figure>
      <figure>
        <img src="slide-02.png" alt="第 2 页 发病检测">
        <figcaption>课件 · 第 2 页 · 发病检测</figcaption>
      </figure>
      <figure>
        <img src="slide-03.png" alt="第 3 页 常见错误">
        <figcaption>课件 · 第 3 页 · 常见错误</figcaption>
      </figure>
    </div>
    <figure>
      <img src="lecture.png" alt="讲解排版">
      <figcaption>讲解排版 · 同一份课件的句子、公式和数字</figcaption>
    </figure>
  </div>
</body>
</html>
